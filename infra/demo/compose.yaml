name: mendesk-demo

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DEMO_POSTGRES_DATABASE:?Create .env.demo with pnpm demo:env}
      POSTGRES_USER: ${DEMO_POSTGRES_USER:?Create .env.demo with pnpm demo:env}
      POSTGRES_PASSWORD: ${DEMO_POSTGRES_PASSWORD:?Create .env.demo with pnpm demo:env}
      POSTGRES_INITDB_ARGS: --data-checksums
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql

  directus:
    image: directus/directus:12.4.1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DEMO_DIRECTUS_PORT:-8055}:8055"
    environment:
      SECRET: ${DEMO_DIRECTUS_SECRET:?Create .env.demo with pnpm demo:env}
      ADMIN_EMAIL: ${DEMO_DIRECTUS_ADMIN_EMAIL:?Create .env.demo with pnpm demo:env}
      ADMIN_PASSWORD: ${DEMO_DIRECTUS_ADMIN_PASSWORD:?Create .env.demo with pnpm demo:env}
      ADMIN_TOKEN: ${DEMO_DIRECTUS_ADMIN_TOKEN:?Create .env.demo with pnpm demo:env}
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DEMO_POSTGRES_DATABASE:?Create .env.demo with pnpm demo:env}
      DB_USER: ${DEMO_POSTGRES_USER:?Create .env.demo with pnpm demo:env}
      DB_PASSWORD: ${DEMO_POSTGRES_PASSWORD:?Create .env.demo with pnpm demo:env}
      PUBLIC_URL: http://localhost:${DEMO_DIRECTUS_PORT:-8055}
      CORS_ENABLED: "true"
      CORS_ORIGIN: http://localhost:3000
      CORS_CREDENTIALS: "true"
      TELEMETRY: "false"
      WEBSOCKETS_ENABLED: "true"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8055/server/ping').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    volumes:
      - directus_uploads:/directus/uploads
      - directus_extensions:/directus/extensions

volumes:
  postgres_data:
  directus_uploads:
  directus_extensions:
